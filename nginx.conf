# ============================================================
# Nginx configuration for TaskFlow UI
# Serves the Angular production build and handles SPA routing
# ============================================================

server {
    listen 80;
    server_name _;

    # Root directory of the Angular production build
    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version from response headers
    server_tokens off;

    # ── Compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        application/wasm
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────
    # Extracted into a snippet because the two locations below declare
    # add_header directives of their own, which cancels everything inherited
    # from here. Each of them includes the same file rather than repeating the
    # six headers, so a future change cannot land in one place and be forgotten
    # in the others. See the file itself for what each header does.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Health check endpoint ────────────────────────────────
    # Answers without touching the disk, so it tests that Nginx is up rather
    # than that the Angular build was copied correctly. Exact match: it
    # short-circuits try_files, which would otherwise serve index.html with a
    # 200 on this path and make the check pass even with no server behind.
    #
    # The snippet is included like everywhere else: the return below does not
    # set headers, but access_log and default_type do not either, so nothing
    # cancels inheritance here. It is included for consistency, and so that
    # adding an add_header later cannot silently drop the six headers.
    #
    # default_type rather than add_header Content-Type: the latter would send
    # the header twice, Nginx already emitting one.
    #
    # access_log off: this endpoint is polled every few seconds by Docker, and
    # logging it would drown the real traffic.
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;

        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Angular SPA routing ──────────────────────────────────
    # Redirect all requests to index.html to support client-side routing
    # Falls back to 404 only if index.html itself is missing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── index.html — no cache ────────────────────────────────
    # Always serve the latest version of the entry point.
    # index.html carries no content hash, unlike the chunks, so it has to be
    # revalidated on every request for a deployment to be picked up.
    location = /index.html {
        # Re-included: the three add_header below cancel the ones set at server
        # level. Without this line the entry page is served with no security
        # header at all, which is precisely the defect issue #43 fixes.
        include /etc/nginx/snippets/security-headers.conf;

        # no-cache and not no-store. Both force revalidation before reuse, which
        # is what this file needs since it carries no content hash, but no-store
        # additionally forbids any storage, including the back/forward cache.
        # That cost bought nothing: the guarantee comes from no-cache alone.
        #
        # Pragma and Expires are HTTP/1.0 relics with no effect on current
        # browsers once Cache-Control is present, and Pragma is a request header
        # repurposed as a response one. Both removed.
        add_header Cache-Control "no-cache" always;
    }

    # ── Static assets — long cache ───────────────────────────
    # Angular adds content hashes to filenames — safe to cache indefinitely
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|wasm)$ {
        # Re-included for the same reason as above: the Cache-Control below
        # cancels the server-level headers. This block covers every JavaScript
        # chunk of the application, so without this line the code itself was
        # served without a CSP.
        include /etc/nginx/snippets/security-headers.conf;

        # One Cache-Control and not two. The expires directive generates its own
        # Cache-Control: max-age header, which was being sent alongside the
        # add_header below. Browsers read the first one, so immutable was never
        # applied and the revalidation it suppresses kept happening on reload.
        # Everything is stated here instead: max-age is one year, the maximum
        # the specification allows, and immutable tells the browser not to
        # revalidate even then. Safe because Angular puts a content hash in
        # every filename this block matches: a changed file is a new URL.
        add_header Cache-Control "public, max-age=31536000, immutable";

        access_log off;
    }
}
