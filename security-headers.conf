# security-headers.conf — TaskFlow UI container
#
# The six security headers this container sets, in one file so that the three
# places that need them cannot drift apart.
#
# CRITICAL: an add_header in a child block cancels every add_header inherited
# from its parent. Nginx does not warn about this. Any location declaring an
# add_header of its own must include this file again, or it silently loses all
# six. That is the defect this file exists to prevent: before it, the two
# locations below declared cache headers of their own, and the entry page and
# every JavaScript chunk were served with no security header at all, while
# robots.txt received all six.
#
# Strict-Transport-Security is deliberately absent. The reverse proxy sets it
# for both hosts, and it is the layer that terminates TLS, therefore the only
# one that knows the connection is encrypted. Setting it here would send the
# header twice. See nginx/snippets/taskflow-security-headers.conf in
# taskflow-deploy.
#
# always is what makes these headers appear on error responses too. Without it
# Nginx sets them on 2xx and 3xx only, so a 404 would answer without them,
# which is exactly the response an attacker would try to provoke.

# Refuse to render this site in a frame, from any origin. Blocks clickjacking,
# where an attacker overlays an invisible frame of the site on a page of theirs
# and captures clicks meant for it. DENY and not SAMEORIGIN: nothing in this
# application frames itself.
add_header X-Frame-Options "DENY" always;

# Forbid the browser from guessing a response's type from its content when the
# declared Content-Type looks wrong. Without it, a file uploaded as text but
# containing markup can be executed as HTML.
add_header X-Content-Type-Options "nosniff" always;

# Send no Referer header at all when leaving this site. The stricter of the
# available values: a project page URL carries an identifier that has no reason
# to reach a third-party site.
add_header Referrer-Policy "no-referrer" always;

# Legacy XSS filter of older browsers. Modern browsers ignore this header, and
# some consider it harmful, its filter having been an attack surface of its own.
# Kept because it costs nothing and still applies to browsers that read it.
add_header X-XSS-Protection "1; mode=block" always;

# Deny access to three device APIs this application never uses. An empty list
# means no origin at all, including this one.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Content Security Policy — the header that actually limits what a successful
# injection could do.
#
# default-src 'self' is the fallback for every directive not listed: only this
# origin. script-src 'self' repeats it for scripts, where it matters most.
#
# 'unsafe-inline' in style-src is required, not chosen: Angular Material writes
# inline styles at runtime, and the build inlines the critical CSS into the
# document head. Removing it breaks the rendering.
#
# The two fonts.g* origins are Google Fonts, which the application still loads
# from a CDN. They go away with issue #45, which self-hosts the fonts.
#
# connect-src is what XHR, fetch and WebSocket requests are checked against.
# Without it they fall back to default-src 'self', which allows only this
# origin, and every call to api.taskflow.mehdi-rochereau.dev is refused by the
# browser before it leaves. The policy was already written that way before the
# headers were fixed, but it never reached the HTML document, so nothing was
# enforced. Restoring the headers made an incomplete policy effective.
#
# frame-ancestors 'none' is the modern equivalent of X-Frame-Options: DENY.
# Both are set because older browsers read only the latter.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self' https://api.taskflow.mehdi-rochereau.dev; frame-ancestors 'none';" always;
