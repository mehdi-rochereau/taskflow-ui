<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TaskFlow</title>
    <!-- Shown by search engines under the title in results pages. Kept under
       160 characters, beyond which Google truncates it. Describes the
       project rather than the current page: this is a single-page
       application, so every route is served from this one document and no
       per-route description is possible without server-side rendering. -->
    <meta
      name="description"
      content="TaskFlow — a project and task management application built with Angular 21 and Spring Boot 3.5, deployed with a full CI/CD pipeline on a Hetzner VPS."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Roboto is served by the application, see the Fontsource imports in
         styles.scss. The preconnect hints went with it; Lighthouse reported
         the one to fonts.googleapis.com as unused.
         Angular's font optimisation still re-inserts a preconnect to
         fonts.gstatic.com at build time, because it inlines the Material Icons
         stylesheet and the font file itself stays remote. That goes away with
         the icons. -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
