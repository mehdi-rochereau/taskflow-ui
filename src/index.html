<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TaskFlow</title>
    <!-- Shown by search engines under the title in results pages. Kept under
       160 characters, beyond which Google truncates it. Describes the
       project rather than the current page: this is a single-page
       application, so every route is served from this one document and no
       per-route description is possible without server-side rendering. -->
    <meta
      name="description"
      content="TaskFlow — a project and task management application built with Angular 21 and Spring Boot 3.5, deployed with a full CI/CD pipeline on a Hetzner VPS."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- No font is loaded from a third party any more. Roboto is served by the
         application through the Fontsource imports in styles.scss, and the
         Material Icons font is gone entirely: icons are individual SVG files
         under public/icons/, resolved by MatIconRegistry, see app.config.ts.
         That font weighed 128 kB for twenty-eight glyphs; the SVG files weigh
         7.7 kB in total. The preconnect hints went with the links, and Angular
         no longer re-inserts one since there is no remote stylesheet left to
         inline. -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
