<footer class="footer">
  <mat-divider />
  <div class="footer-content">
    <div class="footer-links">
      <span class="footer-label">API Documentation</span>
      <a
        [href]="swaggerUrl"
        target="_blank"
        rel="noopener noreferrer"
        mat-button
        aria-label="Swagger, opens in a new tab"
      >
        <mat-icon svgIcon="api" aria-hidden="true"></mat-icon>
        Swagger
      </a>
      <a
        routerLink="/api-docs"
        target="_blank"
        rel="noopener noreferrer"
        mat-button
        aria-label="Redoc, opens in a new tab"
      >
        <mat-icon svgIcon="description" aria-hidden="true"></mat-icon>
        Redoc
      </a>
    </div>

    <div class="footer-center">
      <span>© {{ currentYear }} TaskFlow — Built by Mehdi Rochereau</span>
    </div>

    <div class="footer-links">
      <span class="footer-label">Developer</span>
      <a
        [href]="githubUrl"
        target="_blank"
        rel="noopener noreferrer"
        mat-button
        aria-label="GitHub, opens in a new tab"
      >
        <mat-icon svgIcon="code" aria-hidden="true"></mat-icon>
        GitHub
      </a>
      <a
        [href]="linkedinUrl"
        target="_blank"
        rel="noopener noreferrer"
        mat-button
        aria-label="LinkedIn, opens in a new tab"
      >
        <mat-icon svgIcon="work" aria-hidden="true"></mat-icon>
        LinkedIn
      </a>
    </div>
  </div>
</footer>
