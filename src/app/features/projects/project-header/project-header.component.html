<div class="project-header">
  <div class="header-top">
    <button mat-icon-button routerLink="/projects" aria-label="Back to projects">
      <mat-icon svgIcon="arrow_back" aria-hidden="true"></mat-icon>
    </button>
    <div class="header-right">
      <button mat-flat-button (click)="createTask.emit()" [disabled]="isSubmitting">
        <span class="btn-content">
          @if (isSubmitting) {
            <mat-spinner diameter="20" aria-label="Creating task" />
          } @else {
            <mat-icon svgIcon="add" aria-hidden="true"></mat-icon>
          }
          New Task
        </span>
      </button>
    </div>
  </div>

  <div class="header-center">
    <h1>{{ project.name }}</h1>
    <p class="meta">Owner: {{ project.ownerUsername }}</p>
    <p class="meta">Created: {{ project.createdAt | date: 'mediumDate' }}</p>
  </div>
</div>

@if (project.description) {
  <p class="description">{{ project.description }}</p>
}
